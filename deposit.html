<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Deposito</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="menu.html">Alke Wallet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
          <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
          <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="btnLogout">Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="contenedor">
    <h3>Depositar fondos</h3>
    <p>Saldo actual: $ <span id="saldoActual">0</span></p>

    <form id="formDeposito">
      <div class="mb-3">
        <label for="monto" class="form-label">Monto a depositar</label>
        <input type="number" class="form-control" id="monto" min="1" placeholder="Ej: 10000" required>
      </div>
      <button type="submit" class="btn btn-primary">Realizar deposito</button>
      <p id="mensajeDeposito" class="mt-3"></p>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/deposit.js"></script>
</body>
</html>
