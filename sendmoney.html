<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Enviar dinero</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="menu.html">Alke Wallet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
          <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
          <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="btnLogout">Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="contenedor">
    <h3>Enviar dinero</h3>
    <p>Saldo actual: $ <span id="saldoActual">0</span></p>

    <div class="mb-3">
      <label for="buscarContacto" class="form-label">Buscar contacto</label>
      <input type="text" class="form-control" id="buscarContacto" placeholder="Escribe un nombre...">
      <div id="listaContactos" class="mt-1"></div>
    </div>

    <form id="formEnvio">
      <div class="mb-3">
        <label for="contactoSeleccionado" class="form-label">Contacto seleccionado</label>
        <input type="text" class="form-control" id="contactoSeleccionado" readonly>
      </div>
      <div class="mb-3">
        <label for="montoEnvio" class="form-label">Monto a enviar</label>
        <input type="number" class="form-control" id="montoEnvio" min="1" required>
      </div>
      <button type="submit" class="btn btn-primary">Enviar</button>
      <p id="mensajeEnvio" class="mt-3"></p>
    </form>

    <hr>

    <h5>Agregar nuevo contacto</h5>
    <form id="formNuevoContacto" class="row g-2">
      <div class="col-md-6">
        <input type="text" class="form-control" id="nombreContacto" placeholder="Nombre">
      </div>
      <div class="col-md-4">
        <input type="text" class="form-control" id="cuentaContacto" placeholder="N° de cuenta">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-secondary w-100">Agregar</button>
      </div>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/sendmoney.js"></script>
</body>
</html>
