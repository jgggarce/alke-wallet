<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alke Wallet - Menu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="menu.html">Alke Wallet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
          <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar dinero</a></li>
          <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" id="btnLogout">Salir</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">

    <div class="balance-card">
      <h3>Saldo disponible</h3>
      <div class="monto">$ <span id="saldoActual">0</span></div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <div class="card card-opcion bg-white">
          <h5>Depositar fondos</h5>
          <p>Agrega dinero a tu cuenta</p>
          <a href="deposit.html" class="btn btn-outline-primary">Ir a depositar</a>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card card-opcion bg-white">
          <h5>Enviar dinero</h5>
          <p>Transfiere a tus contactos</p>
          <a href="sendmoney.html" class="btn btn-outline-primary">Enviar</a>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card card-opcion bg-white">
          <h5>Movimientos</h5>
          <p>Revisa tu historial</p>
          <a href="transactions.html" class="btn btn-outline-primary">Ver historial</a>
        </div>
      </div>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
